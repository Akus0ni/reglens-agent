[project]
name = "reglens-agent"
version = "0.1.0"
description = "A LangGraph compliance-review agent that researches Indian NBFC regulation through the RegLens MCP server and files cited findings after human approval."
readme = "README.md"
authors = [
    { name = "Akash Soni", email = "31813761+Akus0ni@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-anthropic>=1.7.12",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-langchain>=0.63.1",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
]

[project.scripts]
reglens-agent = "reglens_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
